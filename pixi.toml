## R environment for the build scripts, pinned to the versions the releases were built with
## (also listed in DEPENDENCIES.md and recorded per build in _build_record/run.csv).
##   pixi install            then run jobs with AD_LOCI_RSCRIPT=$PWD/.pixi/envs/default/bin/Rscript
[workspace]
name = "xQTL-AD-loci-explorer"
channels = ["dnachun", "conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
r-base = "4.5.3.*"
"r-data.table" = "1.18.6.1.*"
r-stringr = "1.6.0.*"
r-dplyr = "1.2.1.*"
r-tidyr = "1.3.2.*"
r-tidyverse = "2.0.0.*"
r-ggplot2 = "4.0.3.*"
r-openxlsx = "4.2.*"
r-pecotmr = "0.8.2.*"
